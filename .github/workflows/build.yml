name: Build Apple TV IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build IPA
        run: |
          unzip -q "PrivateIPTV-tvOS16-v0.1.2-source.zip" -d source
          cd source/PrivateIPTV
          python3 -u build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateIPTV-tvOS16-TrollStore
          path: source/PrivateIPTV/dist/
          if-no-files-found: error
          retention-days: 14

