name: Publish direct IPA download

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privateiptv-release-v0.1.3
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and build IPA
        run: |
          printf '%s\n' '491dcc37ef7229dd0d05ed2f98f506e8bf5b85343663919b8c93f1666257feb1  PrivateIPTV-tvOS16-v0.1.3-source.zip' | shasum -a 256 -c -
          unzip -q "PrivateIPTV-tvOS16-v0.1.3-source.zip" -d source
          cd source/PrivateIPTV
          python3 -u build.py
      - name: Publish IPA for TrollStore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' 'Private IPTV 0.1.3 for Apple TV running tvOS 16.0 or later.' 'Raises playlist capacity to 500,000 entries and 256 MB per list. Imports now parse line by line; cache reading, writing and channel filtering run in the background. A failed import keeps the previous playlist. Existing themes, remote navigation and icon are preserved. Update the existing app using TrollStore-tvOS to retain playlists and favorites.' 'Validated with 500,000 entries, a 256 MB file, over-limit rejection and Foundation cache round-trip, plus native tvOS compilation, static analysis, icon generation, signature and IPA checks. Large provider playlists and playback still require testing on a physical Apple TV.' > release-notes.txt
          gh release create v0.1.3 source/PrivateIPTV/dist/PrivateIPTV-tvOS16-v0.1.3.ipa source/PrivateIPTV/dist/BUILD-REPORT.json --target "$RELEASE_COMMIT" --title "Private IPTV 0.1.3 for Apple TV" --notes-file release-notes.txt

