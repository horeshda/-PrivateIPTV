name: Publish direct IPA download

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privateiptv-release-v0.1.5
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and build IPA
        run: |
          printf '%s\n' '7e1d79eccfbbf0635dda6a37c6cfe195dc24f68e3ba773740ffb8cb62bf4a5e2  PrivateIPTV-tvOS16-v0.1.5-source.zip' | shasum -a 256 -c -
          unzip -q "PrivateIPTV-tvOS16-v0.1.5-source.zip" -d source
          cd source/PrivateIPTV
          python3 -u build.py
      - name: Publish IPA for TrollStore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' 'Private IPTV 0.1.5 for Apple TV running tvOS 16.0 or later.' 'Reworks player controls and lifecycle after reports that 0.1.4 still froze. All native decoder operations now run on a dedicated serial queue. The UI uses snapshots and never waits for decoder shutdown. Removes unconditional channel-grid layout invalidation. Replaces nested subtitle dialogs with one focusable menu, adds a focus target while controls are hidden, and preserves playlists, favorites, themes and icon. Install over the existing app with TrollStore-tvOS.' 'Required build checks: real TVVLCKit playback in tvOS Simulator, six playback-return cycles, all four subtitle sizes through the CC menu, audio menu, pause/resume, next channel, favorites and focus restoration. Also parser and Foundation cache tests, native compilation, static analysis, signing and IPA validation. These checks do not replace testing on the physical Apple TV or with a Siri Remote. See BUILD-REPORT.json.' > release-notes.txt
          gh release create v0.1.5 source/PrivateIPTV/dist/PrivateIPTV-tvOS16-v0.1.5.ipa source/PrivateIPTV/dist/BUILD-REPORT.json --target "$RELEASE_COMMIT" --title "Private IPTV 0.1.5 for Apple TV" --notes-file release-notes.txt

